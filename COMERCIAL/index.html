<!DOCTYPE html>
<html lang="es">
<head>

<title>IMPERIOTEX · Comercial (V9)</title>
<link rel="stylesheet" href="css/base.css">
</head>
<body>

<aside id="sidebar">
  <div class="logo"><b>IMPERIOTEX · SARA BQ</b><span>ERP - Comercial (V9)</span></div>
  <nav id="nav"></nav>
  <div class="foot">Prototipo funcional · Ventas y caja sobre la base de datos compartida<br>
    <button class="btn-link" style="color:#fff;padding:4px 0" title="Reinicia la base compartida de Inventarios, Compras, Producción y Comercial con el escenario actual" onclick="Store.reiniciar()">↺ Reiniciar todo el prototipo</button></div>
</aside>

<div id="main">
  <div id="topbar">
    <div id="breadcrumb">Comercial</div>
    <div class="spacer"></div>
    <div id="bd-sel" style="margin-right:10px"></div>
    <a class="homebtn" href="../index.html" title="Volver a la portada de módulos">⌂ Inicio</a>
    <div class="company-sel"><label>Módulo:</label>
      <select onchange="if(this.value)location.href=this.value">
        <option value="../INVENTARIOS/index.html">Inventarios (GI)</option>
        <option value="../COMPRAS/index.html">Compras (CO)</option>
        <option value="../PRODUCCION/index.html">Producción (PRODUCCION)</option>
        <option value="" selected>Comercial (CL)</option>
      </select>
    </div>
    <div class="company-sel"><label>Empresa:</label>
      <select onchange="UI.toast('La demo comercial trae datos de IMPERIOTEX');this.value='IMPERIOTEX'">
        <option value="IMPERIOTEX" selected>IMPERIOTEX</option>
        <option value="CATINNA NOW">CATINNA NOW</option>
      </select>
    </div>
    <div class="company-sel" title="Usuario de la demo: cambia el perfil de permisos y la tienda asignada"><label>Usuario:</label>
      <select id="user-sel" onchange="App.cambiarUsuario(this.value)"></select>
    </div>
    <div class="userchip"><div class="avatar" id="user-avatar">U</div><span id="user-sede"></span></div>
  </div>
  <div id="content"></div>
</div>

<div id="modales"></div>
<div class="toast" id="toast"></div>
